<!-- Template "Invite user" de Supabase Auth. En prod se pega en
     Authentication → Emails → Invite user. El link va a /auth/confirm con
     token_hash (no {{ .ConfirmationURL }}): la app verifica el token del lado
     del servidor y manda al invitado a crear su contraseña. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #0f172a;">
  <p style="font-size: 20px; font-weight: 800; margin: 0 0 24px;">Tourfy</p>
  <h1 style="font-size: 22px; font-weight: 800; margin: 0 0 12px;">Te invitaron a Tourfy</h1>
  <p style="font-size: 15px; line-height: 1.6; color: #475569; margin: 0 0 24px;">
    Tu equipo te sumó a su cuenta de Tourfy para atender las conversaciones de WhatsApp de la agencia.
    Acepta la invitación y crea tu contraseña para entrar.
  </p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/set-password"
     style="display: inline-block; background: #0f1b3d; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 15px; padding: 12px 24px; border-radius: 12px;">
    Aceptar invitación
  </a>
  <p style="font-size: 13px; line-height: 1.6; color: #94a3b8; margin: 32px 0 0;">
    Si no esperabas esta invitación, puedes ignorar este correo.
  </p>
</div>
