<!-- Template "Reset password" de Supabase Auth. En prod se pega en
     Authentication → Emails → Reset password. Mismo patron que invite.html:
     token_hash → /auth/confirm → /set-password. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #0f172a;">
  <p style="font-size: 20px; font-weight: 800; margin: 0 0 24px;">Tourfy</p>
  <h1 style="font-size: 22px; font-weight: 800; margin: 0 0 12px;">Restablece tu contraseña</h1>
  <p style="font-size: 15px; line-height: 1.6; color: #475569; margin: 0 0 24px;">
    Recibimos un pedido para cambiar la contraseña de tu cuenta de Tourfy. Toca el botón para crear una nueva.
  </p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/set-password"
     style="display: inline-block; background: #0f1b3d; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 15px; padding: 12px 24px; border-radius: 12px;">
    Crear nueva contraseña
  </a>
  <p style="font-size: 13px; line-height: 1.6; color: #94a3b8; margin: 32px 0 0;">
    Si no lo pediste, ignora este correo: tu contraseña sigue igual.
  </p>
</div>
