# Config de pnpm (pnpm 11 ya no lee el field "pnpm" de package.json).
# allowBuilds = dependencias autorizadas a correr scripts de build/postinstall.
# Next.js necesita sharp (imágenes) y @swc/core (compilación).
allowBuilds:
  '@parcel/watcher': true
  # @sentry/cli descarga su binario en postinstall (upload de source maps)
  '@sentry/cli': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true

# Parches de seguridad en dependencias transitivas (pnpm audit, oct 2026).
# Cada override sube solo dentro de la misma major de la que pide el paquete
# padre. uuid@8 (exceljs) queda afuera: el advisory es de v3/v5/v6 con buffer
# y exceljs solo usa v4; pasarlo a 11 es un cambio de major.
overrides:
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  'fast-uri@<3.1.8': ^3.1.8
  'js-yaml@>=3.0.0 <3.15.2': ^3.15.2
  'browserslist@<4.28.7': ^4.28.7
  'baseline-browser-mapping@<2.11.0': ^2.11.0
  'source-map-js@<1.2.2': ^1.2.2
  # Solo de desarrollo/build (eslint, tailwind).
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'postcss@<8.5.23': ^8.5.23
  'nanoid@>=3.0.0 <3.3.18': ^3.3.18
